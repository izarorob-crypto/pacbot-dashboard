<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PacBot Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: #0b0f19; color: #e2e8f0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  h1 { font-size: 18px; font-weight: 500; margin: 0 0 4px; }
  .updated { font-size: 12px; color: #64748b; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .card { background: #131a2b; border-radius: 12px; padding: 14px; }
  .card .label { font-size: 12px; color: #94a3b8; margin: 0 0 4px; }
  .card .value { font-size: 22px; font-weight: 600; margin: 0; }
  .pos { color: #86efac; } .neg { color: #fb7185; } .neutral { color: #a78bfa; }
  .panel { background: #131a2b; border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 14px; font-weight: 500; margin: 0 0 10px; color: #e2e8f0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 0; border-top: 1px solid #1e293b; }
  .muted { color: #94a3b8; }
  canvas { max-height: 180px; }
  #err { display:none; color:#fb7185; font-size:13px; }
</style>
</head>
<body>
<h1>PacBot</h1>
<p class="updated" id="updated">laden...</p>
<p id="err">Kon data.json niet laden - probeer over een paar minuten opnieuw (het script schrijft elke 3 min een update).</p>
<div class="grid" id="cards"></div>
<div class="panel"><h2>Open posities</h2><table id="posTable"></table></div>
<div class="panel"><h2>Recente activiteit</h2><table id="closedTable"></table></div>
<div class="panel"><h2>Recente P/L</h2><canvas id="chart"></canvas></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
function fmt(n) { return (Math.round(n * 100) / 100).toFixed(2); }
function pnlClass(n) { return n > 0 ? "pos" : (n < 0 ? "neg" : "neutral"); }

fetch("data.json?t=" + Date.now())
  .then(function(r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
  .then(function(d) { render(d); })
  .catch(function(e) { document.getElementById("err").style.display = "block"; document.getElementById("updated").textContent = ""; });

function render(d) {
  document.getElementById("updated").textContent = "bijgewerkt: " + d.updated;

  var a = d.account || {};
  var cards = [
    { label: "Balance", value: fmt(a.balance), cls: "" },
    { label: "Equity", value: fmt(a.equity), cls: "" },
    { label: "Marge-niveau", value: fmt(a.marginLevel) + "%", cls: (a.marginLevel < 200 ? "neg" : "pos") },
    { label: "Vandaag P/L", value: fmt(d.todayPnl), cls: pnlClass(d.todayPnl) }
  ];
  document.getElementById("cards").innerHTML = cards.map(function(c) {
    return '<div class="card"><p class="label">' + c.label + '</p><p class="value ' + c.cls + '">' + c.value + "</p></div>";
  }).join("");

  var posRows = (d.openPositions || []).map(function(p) {
    return "<tr><td>" + p.symbol + " " + p.direction + "</td><td>" + p.lot + "</td><td style=\"text-align:right\" class=\"" + pnlClass(p.pnl) + "\">" + fmt(p.pnl) + "</td></tr>";
  }).join("");
  document.getElementById("posTable").innerHTML = posRows || '<tr><td class="muted">geen open posities</td></tr>';

  var closedRows = (d.recentClosed || []).map(function(c) {
    return "<tr><td>" + c.symbol + " " + c.direction + "</td><td class=\"muted\">" + (c.reason || "") + "</td><td style=\"text-align:right\" class=\"" + pnlClass(c.pnl) + "\">" + fmt(c.pnl) + "</td></tr>";
  }).join("");
  document.getElementById("closedTable").innerHTML = closedRows || '<tr><td class="muted">nog geen recente sluitingen</td></tr>';

  var labels = (d.recentClosed || []).map(function(c) { return c.symbol; }).reverse();
  var values = (d.recentClosed || []).map(function(c) { return c.pnl; }).reverse();
  new Chart(document.getElementById("chart"), {
    type: "bar",
    data: { labels: labels, datasets: [{ data: values, backgroundColor: values.map(function(v) { return v >= 0 ? "#86efac" : "#fb7185"; }) }] },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#94a3b8", font: { size: 10 } }, grid: { display: false } },
        y: { ticks: { color: "#94a3b8" }, grid: { color: "#1e293b" } }
      }
    }
  });
}
</script>
</body>
</html>
